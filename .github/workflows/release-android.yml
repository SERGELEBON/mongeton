# Construit l'APK signé et le publie dans une GitHub Release à chaque tag vX.Y.Z.
# L'app Obtainium (sur le téléphone) détecte la nouvelle Release et propose / installe la mise à jour.
name: Release Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: '1'
      NODE_ENV: production
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier (types + tests)
        run: |
          npx tsc --noEmit
          npx jest --ci

      - name: Vérifier la configuration
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          missing=""
          [ -n "$KEYSTORE_B64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$EXPO_PUBLIC_SUPABASE_URL" ] || missing="$missing EXPO_PUBLIC_SUPABASE_URL"
          [ -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ] || missing="$missing EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Secrets/variables manquants :$missing (voir README, section Publication)"
            exit 1
          fi
          # La version de app.json doit correspondre au tag (v1.2.0 <-> "1.2.0").
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            app_version=$(node -p "require('./app.json').expo.version")
            [ "v${app_version}" = "${GITHUB_REF_NAME}" ] || { echo "::error::Tag ${GITHUB_REF_NAME} ≠ version app.json ${app_version}"; exit 1; }
          fi

      - name: Restaurer la clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MONGETON_KEYSTORE_PASSWORD: ${{ secrets.MONGETON_KEYSTORE_PASSWORD }}
          MONGETON_KEY_PASSWORD: ${{ secrets.MONGETON_KEY_PASSWORD }}
          MONGETON_KEY_ALIAS: ${{ vars.MONGETON_KEY_ALIAS || 'mongeton' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mongeton-release.jks"
          echo "MONGETON_KEYSTORE_FILE=$RUNNER_TEMP/mongeton-release.jks" >> "$GITHUB_ENV"
          # Vérifie clé + mots de passe tout de suite (échec en secondes plutôt qu'après 20 min de build).
          if ! keytool -list -keystore "$RUNNER_TEMP/mongeton-release.jks" -storepass "$MONGETON_KEYSTORE_PASSWORD" -alias "$MONGETON_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::MONGETON_KEYSTORE_PASSWORD ne correspond pas à ANDROID_KEYSTORE_BASE64 (ou alias '$MONGETON_KEY_ALIAS' absent)."
            exit 1
          fi
          if [ "$MONGETON_KEY_PASSWORD" != "$MONGETON_KEYSTORE_PASSWORD" ]; then
            echo "::warning::MONGETON_KEY_PASSWORD diffère de MONGETON_KEYSTORE_PASSWORD (ils sont identiques pour la clé Mongeton)."
          fi

      - name: Générer le projet Android
        run: npx expo prebuild --platform android --no-install

      - name: Construire l'APK
        working-directory: android
        env:
          MONGETON_KEYSTORE_PASSWORD: ${{ secrets.MONGETON_KEYSTORE_PASSWORD }}
          MONGETON_KEY_PASSWORD: ${{ secrets.MONGETON_KEY_PASSWORD }}
          MONGETON_KEY_ALIAS: ${{ vars.MONGETON_KEY_ALIAS || 'mongeton' }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Publier la Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="Mongeton-${GITHUB_REF_NAME}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" \
            --title "Mongeton ${GITHUB_REF_NAME}" --generate-notes

      - name: Conserver l'APK (lancement manuel)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: mongeton-apk
          path: android/app/build/outputs/apk/release/app-release.apk
